
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MuchiPondo Mathematics - Teacher Registration</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f7fb;
        }

        header {
            background-color: #1f4e79;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .container {
            width: 90%;
            max-width: 500px;
            margin: 40px auto;
        }

        .form-box {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            background-color: #1f4e79;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #163a5c;
        }

        .message {
            margin-top: 15px;
            padding: 10px;
            background-color: #ffe0e0;
            color: #b00000;
            border-radius: 5px;
        }

        .links {
            text-align: center;
            margin-top: 20px;
            line-height: 2;
        }

        .links a {
            color: #1f4e79;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <header>
        <h1>MuchiPondo</h1>
        <p>O-Level Mathematics Learning Platform</p>
    </header>

    <div class="container">
        <div class="form-box">
            <h2>Teacher Registration</h2>
            <p>Create a teacher account to request access to the Teachers Section.</p>

            {% if message %}
                <div class="message">{{ message }}</div>
            {% endif %}

            <form method="POST">
                <label for="name">Full Name</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    required
                    autocomplete="name"
                >

                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                    autocomplete="email"
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    minlength="8"
                    required
                    autocomplete="new-password"
                >

                <button type="submit">Register as Teacher</button>
            </form>

            <div class="links">
                <a href="/teacher/login">Already registered? Teacher Login</a>
                <br>
                <a href="/login">Student Login</a>
                <br>
                <a href="/">Return to Home Page</a>
            </div>
        </div>
    </div>
</body>
</html>
